name: kikamagalhaes

services:
  web:
    image: nginx:alpine
    container_name: kikamagalhaes-web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      # Router principal HTTPS (kikamagalhaes.com.br)
      - "traefik.http.routers.kikamagalhaes.rule=Host(`kikamagalhaes.com.br`)"
      - "traefik.http.routers.kikamagalhaes.entrypoints=websecure"
      - "traefik.http.routers.kikamagalhaes.tls=true"
      - "traefik.http.routers.kikamagalhaes.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kikamagalhaes.service=kikamagalhaes-svc"
      
      # Redirecionamento de www para não-www
      - "traefik.http.routers.kikamagalhaes-www.rule=Host(`www.kikamagalhaes.com.br`)"
      - "traefik.http.routers.kikamagalhaes-www.entrypoints=websecure"
      - "traefik.http.routers.kikamagalhaes-www.tls=true"
      - "traefik.http.routers.kikamagalhaes-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kikamagalhaes-www.middlewares=kikamagalhaes-www-redirect"
      - "traefik.http.routers.kikamagalhaes-www.service=kikamagalhaes-svc"
      
      # Middleware de redirecionamento WWW
      - 'traefik.http.middlewares.kikamagalhaes-www-redirect.redirectregex.regex=^https?://www\.kikamagalhaes\.com\.br/(.*)'
      - 'traefik.http.middlewares.kikamagalhaes-www-redirect.redirectregex.replacement=https://kikamagalhaes.com.br/$${1}'
      - "traefik.http.middlewares.kikamagalhaes-www-redirect.redirectregex.permanent=true"

      # Servico interno apontando para a porta 80 do container Nginx
      - "traefik.http.services.kikamagalhaes-svc.loadbalancer.server.port=80"

networks:
  internal:
    name: kikamagalhaes_internal
