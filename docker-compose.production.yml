name: kikamagalhaes

services:
  web:
    image: nginx:alpine
    container_name: kikamagalhaes-web
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      # Router principal HTTPS (kikamagalhaes.com.br)
      - "traefik.http.routers.kikamagalhaes.rule=Host(`kikamagalhaes.com.br`)"
      - "traefik.http.routers.kikamagalhaes.entrypoints=websecure"
      - "traefik.http.routers.kikamagalhaes.tls=true"
      - "traefik.http.routers.kikamagalhaes.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kikamagalhaes.service=kikamagalhaes-svc"
      
      # Redirecionamento de www para não-www
      - "traefik.http.routers.kikamagalhaes-www.rule=Host(`www.kikamagalhaes.com.br`)"
      - "traefik.http.routers.kikamagalhaes-www.entrypoints=websecure"
      - "traefik.http.routers.kikamagalhaes-www.tls=true"
      - "traefik.http.routers.kikamagalhaes-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kikamagalhaes-www.middlewares=redirect-to-non-www"
      
      # Middleware de redirecionamento WWW
      - "traefik.http.middlewares.redirect-to-non-www.redirectregex.regex=^https://www.kikamagalhaes.com.br/(.*)"
      - "traefik.http.middlewares.redirect-to-non-www.redirectregex.replacement=https://kikamagalhaes.com.br/$${1}"
      - "traefik.http.middlewares.redirect-to-non-www.redirectregex.permanent=true"

      # Servico interno apontando para a porta 80 do container Nginx
      - "traefik.http.services.kikamagalhaes-svc.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
    name: traefik_default
